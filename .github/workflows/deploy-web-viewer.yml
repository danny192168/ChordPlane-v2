name: Deploy web viewer

# Builds two things and publishes them together:
#   site/   → the Astro marketing site, served at /
#   viewer  → the Flutter share viewer, served from /viewer/ and reached
#             through the /s/* rewrite in deploy/vercel.json.
# The combined output is pushed to Chordplane-Web, which Vercel deploys.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'lib/web_viewer/**'
      - '.github/workflows/deploy-web-viewer.yml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'web/**'
      - 'lib/app/theme/app_theme.dart'
      - 'lib/core/chords/**'
      - 'lib/features/songs/presentation/widgets/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build marketing site
        run: |
          cd site
          npm ci
          npm run build

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build viewer
        # base-href puts the Flutter assets under /viewer/ so the marketing
        # site can own the real root. The app still reads the browser path,
        # so /s/<token> keeps working through the rewrite.
        run: >
          flutter build web --release
          --target lib/web_viewer/main.dart
          --output build/viewer
          --base-href=/viewer/

      - name: Assemble deploy root
        run: |
          mkdir -p staging
          cp -r site/dist/. staging/
          mkdir -p staging/viewer
          cp -r build/viewer/. staging/viewer/
          # The share-link rewrite is versioned here and copied over the copy
          # that Chordplane-Web keeps, so the two can never drift.
          cp deploy/vercel.json staging/vercel.json

          # Fail loudly rather than deploying a half-built site.
          test -f staging/index.html
          test -f staging/viewer/index.html
          test -f staging/auth/confirm/index.html
          test -f staging/404.html
          test -f staging/vercel.json

      - name: Push to Chordplane-Web
        env:
          TOKEN: ${{ secrets.CHORDPLANE_WEB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/danny192168/Chordplane-Web.git" deploy-web
          cd deploy-web
          git config user.name "chordplane-deploy-bot"
          git config user.email "deploy@chordplane.local"
          # Replace the site with the fresh build, preserving config files.
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name vercel.json ! -name .well-known \
            -exec rm -rf {} +
          cp -r ../staging/. .
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Deploy web viewer from ${GITHUB_SHA::7}"
            git push origin main
          fi

      - name: Notify IndexNow
        # Vercel deploys the pushed commit asynchronously. Wait for the key
        # file to go live before submitting, then fall back to the sitemap if
        # the API is temporarily unavailable.
        run: |
          KEY="ec36b8feed381bb69fbb20f9b59a2249"
          KEY_LOCATION="https://chordplane.citcs.site/${KEY}.txt"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$KEY_LOCATION" > /dev/null; then break; fi
            sleep 20
          done
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{
              \"host\": \"chordplane.citcs.site\",
              \"key\": \"${KEY}\",
              \"keyLocation\": \"${KEY_LOCATION}\",
              \"urlList\": [
                \"https://chordplane.citcs.site/\",
                \"https://chordplane.citcs.site/download/\",
                \"https://chordplane.citcs.site/privacy/\",
                \"https://chordplane.citcs.site/terms/\",
                \"https://chordplane.citcs.site/offline-guitar-chords/\",
                \"https://chordplane.citcs.site/chordpro-reader/\",
                \"https://chordplane.citcs.site/transpose-chords/\",
                \"https://chordplane.citcs.site/setlist-sharing/\",
                \"https://chordplane.citcs.site/ukulele-chords/\"
              ]
            }" || echo "IndexNow submission failed; sitemap.xml remains the source of truth."
