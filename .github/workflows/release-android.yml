name: Release Android APK

# Builds a signed release APK for every `v*` tag and publishes it to a GitHub
# Release with stable asset names, so the download page can always point at
# .../releases/latest/download/chordplane-latest.apk.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the locally verified toolchain: newer stable releases
          # require Android Gradle Plugin >= 9.1.1, while this project is on
          # 9.1.0. Bump both together, not just this line.
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Add the release keystore as a repository secret."
            exit 1
          fi
          mkdir -p keys
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > keys/chordplane-release.keystore
          test -s keys/chordplane-release.keystore

      - name: Write android/key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=../../keys/chordplane-release.keystore
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          case "$TAG" in
            v*) ;;
            *) echo "::error::Release tag must start with 'v' (got '$TAG')."; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build signed APK
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
        run: |
          # Without these the app still works, but cloud share links are
          # compiled out. The fallbacks match lib/web_viewer/web_config.dart.
          # Google sign-in stays hidden when GOOGLE_WEB_CLIENT_ID is empty.
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=SUPABASE_URL="${SUPABASE_URL:-https://eweppodjncodtsiljvak.supabase.co}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-sb_publishable_ikLjo_Uua2EXV5p2rffR2Q_-oOSvF34}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${GOOGLE_WEB_CLIENT_ID:-}" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="${GOOGLE_IOS_CLIENT_ID:-}"

      - name: Package release assets
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/chordplane-latest.apk
          cd dist
          sha256sum chordplane-latest.apk > chordplane-latest.apk.sha256
          cat chordplane-latest.apk.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/chordplane-latest.apk \
            dist/chordplane-latest.apk.sha256 \
            --title "ChordPlane ${{ steps.version.outputs.name }}" \
            --generate-notes

      - name: Remove signing material
        if: always()
        run: rm -rf keys android/key.properties
